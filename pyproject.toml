[project]
name = "ragpythonapp"
version = "0.1.0"
description = "Event-driven RAG agent: PDF ingestion + grounded Q&A with FastAPI, Inngest, Qdrant and OpenAI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]
